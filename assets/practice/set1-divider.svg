<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" font-family="Arial, sans-serif" font-size="14">
<title>Practice set 1: voltage divider schematic</title>
<rect width="420" height="260" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none">
<!-- left wire: battery -->
<line x1="60" y1="40" x2="60" y2="105"/><line x1="60" y1="135" x2="60" y2="220"/>
<line x1="40" y1="105" x2="80" y2="105"/><line x1="50" y1="135" x2="70" y2="135" stroke-width="4"/>
<line x1="60" y1="40" x2="150" y2="40"/>
<!-- R1 horizontal zigzag -->
<polyline points="150,40 160,30 175,50 190,30 205,50 220,30 235,50 245,40"/>
<line x1="245" y1="40" x2="320" y2="40"/>
<!-- R2 vertical -->
<line x1="320" y1="40" x2="320" y2="95"/>
<polyline points="320,95 310,105 330,120 310,135 330,150 310,165 320,175"/>
<line x1="320" y1="175" x2="320" y2="220"/>
<line x1="60" y1="220" x2="320" y2="220"/>
<!-- ground -->
<line x1="190" y1="220" x2="190" y2="235"/><line x1="170" y1="235" x2="210" y2="235"/><line x1="178" y1="242" x2="202" y2="242"/><line x1="186" y1="249" x2="194" y2="249"/>
<!-- output tap -->
<line x1="320" y1="40" x2="380" y2="40"/><circle cx="380" cy="40" r="4" fill="#111"/>
</g>
<text x="18" y="112">+</text><text x="85" y="125">V1</text><text x="85" y="142">12 V</text>
<text x="180" y="22">R1 10k</text><text x="338" y="130">R2 10k</text>
<text x="365" y="65">OUT</text><text x="95" y="35">IN</text>
</svg>
