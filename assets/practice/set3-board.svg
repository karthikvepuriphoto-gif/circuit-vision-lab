<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Arial, sans-serif" font-size="12">
<title>Practice set 3: top view of a small sensor board (illustration)</title>
<rect width="520" height="320" fill="#fff"/>
<rect x="20" y="20" width="480" height="280" rx="14" fill="#1f6b3a" stroke="#0d3b20" stroke-width="3"/>
<g fill="#e8e8e8"><circle cx="40" cy="40" r="8"/><circle cx="480" cy="40" r="8"/><circle cx="40" cy="280" r="8"/><circle cx="480" cy="280" r="8"/></g>
<!-- U1 SOIC-8 -->
<rect x="200" y="110" width="90" height="70" fill="#222"/><circle cx="212" cy="122" r="4" fill="#555"/>
<g fill="#ccc"><rect x="185" y="118" width="15" height="6"/><rect x="185" y="134" width="15" height="6"/><rect x="185" y="150" width="15" height="6"/><rect x="185" y="166" width="15" height="6"/><rect x="290" y="118" width="15" height="6"/><rect x="290" y="134" width="15" height="6"/><rect x="290" y="150" width="15" height="6"/><rect x="290" y="166" width="15" height="6"/></g>
<!-- resistors (0805 style, black with code) -->
<g fill="#111" stroke="#bbb" stroke-width="2"><rect x="90" y="70" width="34" height="18"/><rect x="90" y="110" width="34" height="18"/><rect x="340" y="70" width="34" height="18"/></g>
<g fill="#fff" font-size="9"><text x="98" y="83">103</text><text x="98" y="123">472</text><text x="346" y="83">331</text></g>
<!-- capacitors (tan) -->
<g fill="#c9a66b" stroke="#bbb" stroke-width="2"><rect x="215" y="70" width="30" height="18"/><rect x="340" y="200" width="30" height="18"/></g>
<!-- LED -->
<rect x="420" y="70" width="30" height="20" fill="#f4f4f4" stroke="#bbb" stroke-width="2"/><rect x="430" y="74" width="10" height="12" fill="#e33"/>
<!-- header J1 -->
<rect x="60" y="230" width="120" height="30" fill="#111"/>
<g fill="#d4af37"><rect x="70" y="240" width="10" height="10"/><rect x="95" y="240" width="10" height="10"/><rect x="120" y="240" width="10" height="10"/><rect x="145" y="240" width="10" height="10"/></g>
<!-- silkscreen -->
<g fill="#fff"><text x="96" y="64">R1</text><text x="96" y="146">R2</text><text x="346" y="64">R3</text><text x="220" y="64">C1</text><text x="346" y="236">C2</text><text x="425" y="64">D1</text><text x="236" y="198">U1</text><text x="100" y="225">J1</text>
<text x="66" y="276" font-size="9">VCC</text><text x="91" y="276" font-size="9">GND</text><text x="116" y="276" font-size="9">SDA</text><text x="141" y="276" font-size="9">SCL</text></g>
</svg>
