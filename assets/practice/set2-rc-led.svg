<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="Arial, sans-serif" font-size="14">
<title>Practice set 2: RC filter feeding an LED branch</title>
<rect width="480" height="260" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none">
<!-- source circle -->
<circle cx="50" cy="130" r="22"/><path d="M38 130 q6 -12 12 0 t12 0"/>
<line x1="50" y1="108" x2="50" y2="40"/><line x1="50" y1="152" x2="50" y2="220"/>
<line x1="50" y1="40" x2="110" y2="40"/>
<polyline points="110,40 118,30 130,50 142,30 154,50 166,30 178,50 186,40"/>
<line x1="186" y1="40" x2="300" y2="40"/>
<!-- C1 vertical at x=240 -->
<line x1="240" y1="40" x2="240" y2="120"/><line x1="220" y1="120" x2="260" y2="120"/><line x1="220" y1="132" x2="260" y2="132"/><line x1="240" y1="132" x2="240" y2="220"/>
<!-- R2 vertical at x=380 -->
<line x1="300" y1="40" x2="380" y2="40"/><line x1="380" y1="40" x2="380" y2="60"/>
<polyline points="380,60 370,68 390,80 370,92 390,104 380,112"/>
<line x1="380" y1="112" x2="380" y2="140"/>
<!-- LED D1 triangle pointing down -->
<polygon points="365,140 395,140 380,165"/><line x1="365" y1="165" x2="395" y2="165"/>
<line x1="398" y1="148" x2="412" y2="138"/><line x1="400" y1="158" x2="414" y2="148"/>
<line x1="380" y1="165" x2="380" y2="220"/>
<line x1="50" y1="220" x2="380" y2="220"/>
<line x1="215" y1="220" x2="215" y2="232"/><line x1="200" y1="232" x2="230" y2="232"/><line x1="207" y1="238" x2="223" y2="238"/>
</g>
<g fill="#111"><circle cx="240" cy="40" r="4"/><circle cx="240" cy="220" r="4"/></g>
<text x="80" y="135">V1 5 V</text><text x="125" y="22">R1 1k</text><text x="268" y="130">C1 1µF</text>
<text x="400" y="90">R2 330</text><text x="405" y="175">D1 (LED)</text>
<text x="230" y="28">n1</text><text x="385" y="133">n2</text>
</svg>
